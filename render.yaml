# ═══════════════════════════════════════════════════════════
# MindTrack AI v4 — Render Blueprint (render.yaml)
# Deploy: https://dashboard.render.com → New → Blueprint
# Connect GitHub repo: DEV281/mindtrack-ai
# ═══════════════════════════════════════════════════════════

databases:
  - name: mindtrack-db
    plan: free
    databaseName: mindtrack
    user: mindtrack
    postgresMajorVersion: "15"

services:
  # ── Backend API (FastAPI + ViT Model) ──
  - type: web
    name: mindtrack-backend
    runtime: docker
    plan: starter              # $7/mo — needed for PyTorch + 327MB model
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mindtrack-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: mindtrack-redis
          property: connectionString
      - key: GROQ_API_KEY
        sync: false            # Set manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://mindtrack-frontend.onrender.com
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "true"
      - key: PORT
        value: "8000"
    disk:
      name: mindtrack-data
      mountPath: /app/data
      sizeGB: 1                # For the trained ViT model file

  # ── Frontend (React Static Site) ──
  - type: web
    name: mindtrack-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://mindtrack-backend.onrender.com
      - key: VITE_WS_URL
        value: wss://mindtrack-backend.onrender.com

  # ── Redis ──
  - type: redis
    name: mindtrack-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []            # Internal access only
